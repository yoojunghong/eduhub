# 로컬 개발용. 로컬에 설치한 PostgreSQL에 접속하고, 접속 정보는 환경 변수로만 받는다 (.env.example 참고, NFR-03)
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eduhub}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

logging:
  level:
    # 실행되는 SQL 을 보며 N+1 을 확인한다 (NFR-02)
    org.hibernate.SQL: debug
